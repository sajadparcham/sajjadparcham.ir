
<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />

  <!-- ================================================================
       VIEWPORT
       ----------------------------------------------------------------
       باعث می‌شود سایت روی موبایل درست نمایش داده شود.
  ================================================================= -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />


  <!-- ================================================================
       THEME COLOR
       ----------------------------------------------------------------
       رنگ مرورگر موبایل را با تم سایت هماهنگ می‌کند.
  ================================================================= -->

  <meta
    name="theme-color"
    content="#050505"
  />


  <!-- ================================================================
       DESCRIPTION
       ----------------------------------------------------------------
       توضیح کوتاه سایت برای موتورهای جستجو.
       
       بعداً می‌توانیم این قسمت را حرفه‌ای‌تر و SEO محور کنیم.
  ================================================================= -->

  <meta
    name="description"
    content="وب‌سایت شخصی سجاد پرچم؛ مهندس هوش مصنوعی، پژوهشگر و توسعه‌دهنده نرم‌افزار."
  />


  <!-- ================================================================
       KEYWORDS
       ----------------------------------------------------------------
       امروزه اهمیت keywords کمتر شده، ولی فعلاً نگهش می‌داریم.
  ================================================================= -->

  <meta
    name="keywords"
    content="سجاد پرچم, هوش مصنوعی, مهندسی نرم افزار, Machine Learning, AI Engineer, Researcher"
  />


  <!-- ================================================================
       AUTHOR
  ================================================================= -->

  <meta
    name="author"
    content="Sajad Parcham"
  />


  <!-- ================================================================
       TITLE
       ----------------------------------------------------------------
       عنوانی که در Tab مرورگر نمایش داده می‌شود.
  ================================================================= -->

  <title>
    سجاد پرچم | AI Engineer & Researcher
  </title>


  <!-- ================================================================
       GOOGLE / SOCIAL PREVIEW
       ----------------------------------------------------------------
       بعداً برای LinkedIn / Telegram / WhatsApp و...
       تصویر اختصاصی اضافه می‌کنیم.
  ================================================================= -->

  <meta
    property="og:title"
    content="سجاد پرچم | AI Engineer & Researcher"
  />

  <meta
    property="og:description"
    content="وب‌سایت شخصی سجاد پرچم؛ مهندس هوش مصنوعی، پژوهشگر و توسعه‌دهنده نرم‌افزار."
  />

  <meta
    property="og:type"
    content="website"
  />

</head>


<body>

  <!-- ================================================================
       ROOT
       ----------------------------------------------------------------
       React تمام سایت را داخل این عنصر Render می‌کند.
  ================================================================= -->

  <div id="root"></div>


  <!-- ================================================================
       VITE ENTRY
  ================================================================= -->

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
